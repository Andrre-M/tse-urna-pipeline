name: dashboard

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "dashboard/**"
      - "scripts/build_dashboard.py"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Download official IBGE map inputs
        run: |
          mkdir -p .dashboard-cache/ibge
          curl --fail --location --retry 3 \
            "https://servicodados.ibge.gov.br/api/v1/localidades/estados/CE/municipios" \
            --output .dashboard-cache/ibge/municipalities.json
          curl --fail --location --retry 3 \
            "https://servicodados.ibge.gov.br/api/v3/malhas/estados/23?formato=application/vnd.geo+json&qualidade=minima&intrarregiao=municipio" \
            --output .dashboard-cache/ibge/municipalities.geojson
      - name: Build dashboard from published Gold
        run: |
          uv run python scripts/build_dashboard.py \
            --cache-dir .dashboard-cache/gold \
            --source-dir dashboard \
            --output-dir dist \
            --geojson .dashboard-cache/ibge/municipalities.geojson \
            --ibge-municipalities .dashboard-cache/ibge/municipalities.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
