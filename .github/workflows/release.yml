name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ ! -f "$notes" ]]; then
            echo "Release notes not found: $notes" >&2
            exit 1
          fi
          title="$(sed -n '1s/^# //p' "$notes")"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --latest \
            --title "${title:-$GITHUB_REF_NAME}" \
            --notes-file "$notes"
