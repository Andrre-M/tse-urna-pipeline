[project]
name = "tse-urna-pipeline"
version = "0.2.1"
description = "Pipeline reprodutível para ingestão e preparação dos logs públicos de urnas eletrônicas do TSE."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "André"}]
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "py7zr>=1.1,<2",
  "polars>=1.20,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
urna-etl = "tse_urna.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tse_urna"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
